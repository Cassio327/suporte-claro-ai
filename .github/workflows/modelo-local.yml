name: Experimento com modelo local
on:
  workflow_dispatch:
    inputs:
      cenario:
        description: Cenário da rodada
        type: choice
        default: login
        options: [login, audio, revisao, comunicacao, permissao]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  avaliar-prompts:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'experimento/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPORTE_PROVEDOR: ollama
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Iniciar a API e obter os pesos
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.11.4
          curl --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 -fsS http://127.0.0.1:11434/api/version
          docker exec ollama ollama pull "$OLLAMA_MODEL"
          mkdir -p rodada
          curl -fsS http://127.0.0.1:11434/api/tags > rodada/modelos.json
      - name: Gerar quatro pares para o ticket de login
        if: ${{ !contains(fromJSON('["audio", "revisao", "comunicacao", "permissao"]'), inputs.cenario) && github.head_ref != 'experimento/personalizacao-audio' && github.head_ref != 'experimento/revisao-resolucao' && github.head_ref != 'experimento/canal-estilo' && github.head_ref != 'experimento/permissao-documento' }}
        run: |
          python -m suporte comparar --perfil P01 --exemplo login --tipo todos
          cp historico/comparacoes/*.json rodada/comparacao.json
          echo "::group::JSON do cenário fictício de login"
          jq -c . rodada/comparacao.json
          echo "::endgroup::"
          jq -c . rodada/modelos.json
          echo "Revisão executada $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Comparar níveis técnicos no ticket de áudio
        if: inputs.cenario == 'audio' || github.head_ref == 'experimento/personalizacao-audio'
        run: |
          for perfil in P01 P02; do
            python -m suporte --pasta "historico/$perfil" gerar --perfil "$perfil" --exemplo audio --tipo resolucao --versao v2
            cp "historico/$perfil"/execucoes/*.json "rodada/audio-$perfil.json"
            jq -c . "rodada/audio-$perfil.json"
          done
          jq -c . rodada/modelos.json
      - name: Testar a revisão no áudio e no upload
        if: inputs.cenario == 'revisao' || github.head_ref == 'experimento/revisao-resolucao'
        run: |
          python -m suporte gerar --perfil P02 --exemplo audio --tipo resolucao --versao v3
          cp historico/execucoes/*.json rodada/audio-P02-v3.json
          jq -c . rodada/audio-P02-v3.json
          python -m suporte comparar --perfil P01 --exemplo upload --tipo resolucao --versoes v2 v3
          cp historico/comparacoes/*.json rodada/upload-v2-v3.json
          jq -c . rodada/upload-v2-v3.json
          jq -c . rodada/modelos.json
      - name: Isolar canal e estilo na resolução de upload
        if: inputs.cenario == 'comunicacao' || github.head_ref == 'experimento/canal-estilo'
        run: |
          for perfil in P03 P04 P05; do
            python -m suporte --pasta "historico/$perfil" gerar --perfil "$perfil" --exemplo upload --tipo resolucao --versao v2
            cp "historico/$perfil"/execucoes/*.json "rodada/upload-$perfil.json"
            jq -c . "rodada/upload-$perfil.json"
          done
          jq -c . rodada/modelos.json
      - name: Testar as duas versões em um ticket inédito de permissão
        if: inputs.cenario == 'permissao' || github.head_ref == 'experimento/permissao-documento'
        env:
          TICKET: "Meu colega abre o documento que compartilhei, mas só consegue visualizar. Já reenviei o convite e continua igual. Quero que ele consiga editar."
        run: |
          for rodada in 1 2; do
            pasta="historico/permissao-$rodada"
            python -m suporte --pasta "$pasta" comparar --perfil P01 --ticket "$TICKET" --tipo resolucao --versoes v2 v3 --novo
            cp "$pasta"/comparacoes/*.json "rodada/permissao-$rodada.json"
            jq -c . "rodada/permissao-$rodada.json"
          done
          jq -c . rodada/modelos.json
      - uses: actions/upload-artifact@v4
        with:
          name: rodada-local
          path: rodada/
          retention-days: 7
