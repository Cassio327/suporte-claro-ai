name: Comparação real de prompts
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: Conteúdo para comparar
        type: choice
        default: perguntas
        options: [perguntas, diagnostico, resolucao, fluxo, todos]
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Comparar as versões no caso de login
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          TIPO: ${{ inputs.tipo }}
        run: python -m suporte comparar --perfil P01 --exemplo login --tipo "$TIPO"
      - uses: actions/upload-artifact@v4
        with:
          name: comparacao-login
          path: historico/comparacoes/*.json
          if-no-files-found: error
          retention-days: 7
