name: Testes
on: [push, pull_request]
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verificar o caminho offline do README
        run: |
          python -m suporte listar
          mkdir -p historico
          python -m suporte relatorio samples/login-ollama-avaliado.json --saida historico/relatorio-login.html
          test -s historico/relatorio-login.html
      - name: Testar o painel no Chrome em desktop e celular
        env:
          PYTHONPATH: .
          SUPORTE_PROVEDOR: groq
          GROQ_MODEL: teste-sem-credencial
        run: |
          python -m pip install playwright==1.56.0
          python tests/navegador.py
